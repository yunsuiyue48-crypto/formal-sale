<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10月 POLO 衫 TOP 商品（按款聚合）</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --line:#e6ebf2; --text:#1d2433; --muted:#6b7787;
    --accent:#ff5a1f; --accent-soft:rgba(255,90,31,.12);
    --glo:#ff5a1f; --glo-bg:rgba(255,90,31,.12);
    --eu:#2f6fed;  --eu-bg:rgba(47,111,237,.12);
    --us:#0f9d58;  --us-bg:rgba(15,157,88,.12);
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
  }
  body.dark{
    --bg:#0f1420; --panel:#161d2b; --line:#26303f; --text:#e8edf5; --muted:#93a1b3;
    --accent:#ff7a45; --accent-soft:rgba(255,122,69,.16);
    --glo:#ff8a5c; --glo-bg:rgba(255,138,92,.18);
    --eu:#6f9cff;  --eu-bg:rgba(111,156,255,.18);
    --us:#43c98a;  --us-bg:rgba(67,201,138,.18);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
  .head-in{max-width:1500px;margin:0 auto;padding:16px 24px 0}
  .title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px}
  .sub b{color:var(--accent);font-variant-numeric:tabular-nums}
  .spacer{flex:1}
  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{position:relative}
  .search input{width:210px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;
    color:var(--text);padding:0 12px 0 32px;font-size:13px;outline:none}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:10px;top:9px;width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2}
  .btn{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--text);
    font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  nav.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto}
  .tab{border:0;background:transparent;color:var(--muted);font-size:14px;padding:10px 14px;cursor:pointer;
    border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .pill{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);
    font-variant-numeric:tabular-nums}
  main{max-width:1500px;margin:0 auto;padding:18px 24px 60px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px;margin-bottom:14px}
  .legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;
    box-shadow:var(--shadow);transition:transform .16s ease,border-color .16s ease;position:relative}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .thumb{position:relative;width:100%;aspect-ratio:3/4;background:
    linear-gradient(110deg,var(--line) 8%,transparent 18%,var(--line) 33%) 0 0/200% 100%;animation:sh 1.2s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
  .thumb img.loaded{opacity:1}
  .idx{position:absolute;top:8px;left:8px;background:rgba(15,20,32,.72);color:#fff;font-size:11px;
    padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)}
  .flag{position:absolute;top:8px;right:8px;font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600;
    background:rgba(15,20,32,.72);color:#fff;backdrop-filter:blur(4px);letter-spacing:.3px}
  .flag.multi{background:var(--accent);color:#fff}
  .regs{display:flex;flex-wrap:wrap;gap:5px;padding:9px 10px 10px}
  .rb{font-size:11px;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rb i{font-style:normal;font-weight:700;margin-right:3px}
  .rb.glo{background:var(--glo-bg);color:var(--glo)}
  .rb.eu{background:var(--eu-bg);color:var(--eu)}
  .rb.us{background:var(--us-bg);color:var(--us)}
  .empty{color:var(--muted);font-size:14px;padding:40px 0;text-align:center}
  .lb{position:fixed;inset:0;z-index:100;background:rgba(8,11,18,.94);display:none;align-items:center;justify-content:center;
    padding:56px 76px}
  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .lb-bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:14px 20px;color:#cfd8e5;
    font-size:13px;flex-wrap:wrap}
  .lb-bar .spacer{flex:1}
  .lb-close,.lb-nav{background:rgba(255,255,255,.1);border:0;color:#fff;width:36px;height:36px;border-radius:9px;
    cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
  .lb-close:hover,.lb-nav:hover{background:var(--accent)}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;font-size:22px}
  .lb-prev{left:16px}.lb-next{right:16px}
  .lb-link{color:#9fb2c9;text-decoration:none;font-size:12px;border-bottom:1px dashed #56637a}
  .lb-link:hover{color:var(--accent)}
  .lb-regs{display:flex;gap:6px;flex-wrap:wrap}
  @media (max-width:720px){
    .head-in,main{padding-left:14px;padding-right:14px}
    .search input{width:150px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .lb{padding:76px 12px 24px}
    .lb-nav{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="title-row">
      <h1>10月 POLO 衫 TOP 商品 · 按款聚合</h1>
      <span class="sub">600 条链接 → <b>479</b> 款｜多区域通用 <b>97</b> 款（三区重合 24 款）｜单区域独有 <b>382</b> 款</span>
      <span class="spacer"></span>
      <div class="tools">
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" placeholder="搜索图片链接 / 行号" autocomplete="off">
        </div>
        <button class="btn" id="theme">切换主题</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main>
  <div class="legend">
    <span><span class="dot" style="background:var(--glo)"></span>glo</span>
    <span><span class="dot" style="background:var(--eu)"></span>eu</span>
    <span><span class="dot" style="background:var(--us)"></span>us</span>
    <span>· 徽标数字为该款在对应区域工作表里的行号，同区多次出现以逗号分隔</span>
    <span>· 右上角标「通用 N 区」即多区域通用款，无标识为单区域独有款</span>
  </div>
  <section class="panel active" data-panel="view">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">没有匹配的款</div>
  </section>
</main>

<div class="lb" id="lb">
  <div class="lb-bar">
    <span id="lbInfo"></span>
    <span class="lb-regs" id="lbRegs"></span>
    <span class="spacer"></span>
    <a class="lb-link" id="lbLink" href="#" target="_blank" rel="noopener">在新标签打开原图 ↗</a>
    <button class="lb-close" id="lbClose" title="关闭">✕</button>
  </div>
  <button class="lb-nav lb-prev" id="lbPrev" title="上一款">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" id="lbNext" title="下一款">›</button>
</div>

const REGIONS = ["glo", "eu", "us"];
const REG_LABEL = {glo:'glo', eu:'eu', us:'us'};

const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const qEl = document.getElementById('q');

const VIEWS = [
  {key:'all',   name:'全部款',       test:()=>true},
  {key:'multi', name:'多区域通用款', test:it=>it.n>=2},
  {key:'glo',   name:'glo 独有',     test:it=>it.n===1 && !!it.r.glo},
  {key:'eu',    name:'eu 独有',      test:it=>it.n===1 && !!it.r.eu},
  {key:'us',    name:'us 独有',      test:it=>it.n===1 && !!it.r.us}
];
let viewKey = 'all';
let shown = [];          // 当前视图过滤后（含搜索）的 url 顺序
let curList = [];        // 当前视图的款列表
let curCards = [];       // 与 curList 索引对应的 DOM

function regBadges(it){
  return REGIONS.filter(k=>it.r[k]).map(k=>{
    const rows = it.r[k].join(',');
    return `<span class="rb ${k}" title="${k} 工作表第 ${rows} 行"><i>${REG_LABEL[k]}</i>${rows}</span>`;
  }).join('');
}

function renderTabs(){
  tabsEl.innerHTML = VIEWS.map(v=>{
    const n = ITEMS.filter(v.test).length;
    return `<button class="tab${v.key===viewKey?' active':''}" data-view="${v.key}">${v.name}<span class="pill">${n}</span></button>`;
  }).join('');
}

function renderGrid(){
  const v = VIEWS.find(x=>x.key===viewKey);
  curList = ITEMS.filter(v.test);
  gridEl.innerHTML = curList.map((it,i)=>{
    const flag = it.n>=2 ? `<span class="flag multi">通用 ${it.n} 区</span>` : '';
    return `<article class="card" data-i="${i}" data-url="${it.u}">
      <div class="thumb">
        <img loading="lazy" src="${it.u}" alt="款 ${i+1}">
        <span class="idx">#${i+1}</span>${flag}
      </div>
      <div class="regs">${regBadges(it)}</div>
    </article>`;
  }).join('');
  curCards = [...gridEl.querySelectorAll('.card')];
  applyFilter();
}

function applyFilter(){
  const kw = qEl.value.trim().toLowerCase();
  shown = [];
  curCards.forEach((c, i)=>{
    const it = curList[i];
    const rowText = REGIONS.filter(k=>it.r[k]).map(k=>k + it.r[k].join(',')).join(' ');
    const hit = !kw || it.u.toLowerCase().includes(kw) || rowText.toLowerCase().includes(kw);
    c.style.display = hit ? '' : 'none';
    if(hit) shown.push(it.u);
  });
  emptyEl.style.display = shown.length ? 'none' : 'block';
}

document.addEventListener('load', e=>{ if(e.target.tagName==='IMG') e.target.classList.add('loaded'); }, true);

tabsEl.addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  viewKey = b.dataset.view;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t===b));
  renderGrid();
  window.scrollTo({top:0,behavior:'smooth'});
});

qEl.addEventListener('input', applyFilter);

const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'),
      lbInfo = document.getElementById('lbInfo'), lbRegs = document.getElementById('lbRegs'),
      lbLink = document.getElementById('lbLink');
let lbPos = 0;

function openLb(url){
  lbPos = Math.max(0, shown.indexOf(url));
  showLb();
  lb.classList.add('open');
}
function showLb(){
  const u = shown[lbPos]; if(!u) return;
  const it = ITEMS.find(x=>x.u===u);
  lbImg.src = u; lbLink.href = u;
  lbInfo.textContent = `${lbPos+1} / ${shown.length}`;
  const tag = it.n >= 2
    ? `<span class="rb" style="background:var(--accent);color:#fff">通用 ${it.n} 区</span>`
    : `<span class="rb" style="background:rgba(255,255,255,.12);color:#cfd8e5">单区域独有</span>`;
  lbRegs.innerHTML = regBadges(it) + tag;
}
function closeLb(){ lb.classList.remove('open'); lbImg.src=''; }
function step(d){ if(!shown.length) return; lbPos = (lbPos + d + shown.length) % shown.length; showLb(); }

gridEl.addEventListener('click', e=>{
  const c = e.target.closest('.card'); if(!c) return;
  openLb(c.dataset.url);
});
document.getElementById('lbClose').onclick = closeLb;
document.getElementById('lbPrev').onclick = ()=>step(-1);
document.getElementById('lbNext').onclick = ()=>step(1);
lb.addEventListener('click', e=>{ if(e.target===lb) closeLb(); });
document.addEventListener('keydown', e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='ArrowRight') step(1);
});

document.getElementById('theme').onclick = ()=>document.body.classList.toggle('dark');

renderTabs(); renderGrid();
</script>
</body>
</html>
